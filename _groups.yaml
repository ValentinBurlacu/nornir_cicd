cisco:
    # username: "cisco"
    # password: "cisco"
    platform: "ios"
    data:
        vendor: "cisco"
        ntp_server: "6.0.0.0"
connection_options:
    scrapli_netconf:
        extras:
            port: 830
            ssh_config_file: True
            auth_strict_key: False
            timeout_transport: 10
    scrapli:
        extras:
            port: 22
            ssh_config_file: True
            auth_strict_key: False
            timeout_transport: 10
    netmiko:
        extras:
            global_delay_factor: 4
    napalm:
        extras:
            global_delay_factor: 4

